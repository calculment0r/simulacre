<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concordance Debord ↔ Simulacre — les 221</title>
<meta name="description" content="Table de concordance : pour chaque thèse, la thèse d'origine de Debord et sa transposition dans la Société du Simulacre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/oblivion.css">
<style>
  .cwrap { max-width: 1180px; margin: 0 auto; padding: 64px 36px 120px; }
  .chead { margin-bottom: 40px; }
  .chead .back {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; transition: color .2s;
  }
  .chead .back:hover { color: var(--accent); }
  .chead h1 {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(34px, 5vw, 54px); line-height: 1.05; letter-spacing: -0.025em;
    color: var(--text); margin: 26px 0 16px;
  }
  .chead h1 .accent { color: var(--accent); }
  .chead .lede {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--muted);
    max-width: 640px; border-left: 2px solid var(--accent); padding-left: 16px;
  }

  .controls {
    position: sticky; top: 0; z-index: 50; background: var(--bg);
    padding: 20px 0; margin-bottom: 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .controls input[type=search] {
    flex: 1; min-width: 220px; background: var(--bg2); border: 1px solid var(--border2);
    color: var(--text); font-family: var(--mono); font-size: 13px; padding: 10px 14px;
  }
  .controls input[type=search]:focus { outline: none; border-color: var(--accent); }
  .chfilter { display: flex; gap: 6px; flex-wrap: wrap; }
  .chfilter button {
    background: transparent; border: 1px solid var(--border2); color: var(--muted);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; padding: 7px 10px;
    cursor: pointer; transition: all .18s;
  }
  .chfilter button:hover { color: var(--text); border-color: var(--dim); }
  .chfilter button.active { background: var(--accent); color: #0a0a0c; border-color: var(--accent); }
  .count { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.1em; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--dim); padding: 14px 16px; border-bottom: 1px solid var(--border2);
    position: sticky; top: 64px; background: var(--bg); z-index: 40;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--bg2); }
  td { padding: 18px 16px; vertical-align: top; }
  td.n { width: 56px; }
  td.n a {
    font-family: var(--mono); font-size: 15px; color: var(--accent); text-decoration: none;
  }
  td.n .ch { display: block; font-size: 9px; color: var(--dim); letter-spacing: 0.1em; margin-top: 4px; }
  td.debord { width: 38%; font-family: var(--serif); font-style: italic; font-size: 15px;
    line-height: 1.55; color: var(--muted); }
  td.frag { font-family: var(--serif); font-size: 16px; line-height: 1.5; color: var(--text); }
  td.links { width: 90px; text-align: right; white-space: nowrap; }
  td.links a {
    font-family: var(--mono); font-size: 10px; color: var(--muted); text-decoration: none;
    display: inline-block; padding: 3px 6px; border: 1px solid var(--border2); margin-bottom: 4px;
    transition: all .18s;
  }
  td.links a:hover { color: var(--accent); border-color: var(--accentDim); }

  @media (max-width: 820px) {
    thead { display: none; }
    td.debord, td.frag { width: auto; display: block; }
    tbody tr { display: grid; grid-template-columns: 56px 1fr; gap: 0 10px; padding: 8px 0; }
    td { padding: 8px 4px; }
    td.n { grid-row: span 3; }
    td.links { text-align: left; }
  }
</style>
</head>
<body>
  <div class="progress-bar" id="prog"></div>
  <div class="cwrap">
    <header class="chead">
      <a class="back" href="index.html">← Accueil</a>
      <h1>concordance <span class="accent">Debord ↔ Simulacre</span></h1>
      <p class="lede">Les 221 thèses, côte à côte. À gauche, la thèse d'origine de Guy Debord (1967). À droite, sa transposition dans la Société du Simulacre. Correspondance N ↔ N.</p>
    </header>

    <div class="controls">
      <input type="search" id="q" placeholder="filtrer (mot du fragment ou de Debord)…" autocomplete="off">
      <div class="chfilter" id="chf"></div>
      <span class="count" id="count"></span>
    </div>

    <table>
      <thead>
        <tr><th>N°</th><th>Debord — thèse d'origine</th><th>Notre fragment — le Simulacre</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="data/theses.js"></script>
  <script>
    const T = window.THESES || [], CH = window.CHAPITRES || [];
    const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const pad3 = n => String(n).padStart(3,'0'), pad = n => String(n).padStart(2,'0');
    let curCh = 0, curQ = '';

    const chf = document.getElementById('chf');
    chf.innerHTML = `<button class="active" data-ch="0">tous</button>` +
      CH.map(c => `<button data-ch="${c.ch}">ch.${pad(c.ch)}</button>`).join('');
    chf.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      curCh = +b.dataset.ch;
      [...chf.children].forEach(x => x.classList.toggle('active', x===b));
      render();
    });
    document.getElementById('q').addEventListener('input', e => { curQ = e.target.value.toLowerCase().trim(); render(); });

    function render() {
      const rows = document.getElementById('rows');
      const list = T.filter(t => {
        if (curCh && t.chapitre !== curCh) return false;
        if (curQ) {
          const hay = (t.fragment + ' ' + t.debord_these + ' ' + t.sens_pour_debord).toLowerCase();
          if (!hay.includes(curQ)) return false;
        }
        return true;
      });
      rows.innerHTML = list.map(t => `
        <tr>
          <td class="n"><a href="index.html#f-${t.n}">${pad3(t.n)}</a><span class="ch">ch.${pad(t.chapitre)}</span></td>
          <td class="debord">${esc(t.debord_these)}</td>
          <td class="frag">${esc(t.fragment)}</td>
          <td class="links">
            <a href="index.html#f-${t.n}">lire ↗</a>
          </td>
        </tr>`).join('');
      document.getElementById('count').textContent = list.length + ' / 221';
    }
    render();

    const prog = document.getElementById('prog');
    addEventListener('scroll', () => {
      const total = document.documentElement.scrollHeight - innerHeight;
      prog.style.width = (total>0?scrollY/total*100:0) + '%';
    }, { passive: true });
  </script>
</body>
</html>
